<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPM 2025 Tracker</title>
<style>
body {
font-family: "Garamond", sans-serif;
background: #fff8f0; /*background color*/
margin: 0;
padding: 0 1rem;
}

header {
text-align: center;
padding: 2rem;
background-image: url('pochacco.jpg'); /* <-- Replace with your image */
background-size: cover;
background-position: center;
color: #DE3163;
border-bottom: 4px solid #ffc0cb;
background-image: url('pink flower.jpeg');
}

}

.countdown {
font-size: 1.5rem;
font-weight: bold;
background: rgba(255, 255, 255, 0.7);
display: inline-block;
padding: 0.5rem 1rem;
border-radius: 8px;
color: #DE3163;
}

.subject {
background: #fff;
margin: 1rem 0;
padding: 1rem;
border-radius: 10px;
border-left: 6px solid #ffd6dc;
box-shadow: 0 0 10px #fce4ec80;
}

.subject h2 {
margin-bottom: 0.5rem;
font-size: 1.4rem;
}

.grade {
font-weight: bold;
color: #b23a48;
margin-top: 1rem;
}

.chapter-list {
list-style: none;
padding-left: 0;
}

.chapter-item {
margin: 0.3rem 0;
}

.chapter-item label {
display: flex;
align-items: center;
gap: 10px;
background-color: #fbe4e8;
padding: 0.4rem 0.8rem;
border-radius: 30px;
max-width: 90%;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
transition: all 0.3s;
cursor: pointer;
}

.chapter-item:hover label,
.chapter-item input:checked + label {
white-space: normal;
max-width: 100%;
}

.chapter-item input {
transform: scale(1.2);
}

.progress {
margin-top: 1rem;
}

.progress-bar {
height: 20px;
background: #fce1e7;
border-radius: 20px;
overflow: hidden;
}

.progress-fill {
height: 100%;
background: #fa7298;
width: 0%;
transition: width 0.4s ease-in-out;
}
  .chapter-item input[type="checkbox"]:checked {
  accent-color: #fa7298;
}
.chapter-item input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid #fa7298;
  border-radius: 4px;
  background-color: #fff;
  cursor: pointer;
  position: relative;
  transition: 0.2s;
}

.chapter-item input[type="checkbox"]:checked {
  background-color: #fa7298;
  border-color: #fa7298;
}

.chapter-item input[type="checkbox"]::before {
  content: '';
  position: absolute;
  top: 1px;
  left: -1px;
  width: 18px;
  height: 18px;
  background-image: url('data:image/svg+xml;utf8,<svg fill="white" viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg"><path d="M23.6,0C21.2,0,19,1.1,17.6,2.8C16.2,1.1,14,0,11.6,0C7.6,0,4.4,3.2,4.4,7.2C4.4,13.6,16,22.4,16,22.4S27.6,13.6,27.6,7.2 C27.6,3.2,24.4,0,20.4,0H23.6z"/></svg>');
  background-size: 16px 16px;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0;
  transition: 0.2s;
}

.chapter-item input[type="checkbox"]:checked::before {
  opacity: 1;
}

</style>
</head>
  
  
<body>
<header>
<h1>SPM 2025 Progress Tracker</h1>
<div class="countdown" id="countdown"></div>
</header>

<main id="tracker"></main>

<script>
const subjects = {
"Kimia": {
"Tingkatan 4": [
"Struktur Atom", "Formula Kimia dan Persamaan Kimia", "Jadual Berkala Unsur",
"Ikatan Kimia", "Asid, Bes dan Garam", "Kadar Tindak Balas", "Bahan Buatan Dalam Industri"
],

"Tingkatan 5": [
"Keseimbangan Redoks", "Sebatian Karbon", "Termokimia", "Polimer", "Kimia Konsumer dan Industri"
]
},
"Biologi": {
"Tingkatan 4": [
"Biologi Sel dan Organisasi Sel", "Pergerakan Bahan Merentasi Membran Plasma", "Komposisi Kimia dalam Sel",
"Metabolisme dan Enzim", "Pembahagian Sel", "Respirasi Sel", "Sistem Respirasi dalam Manusia dan Haiwan",
"Nutrisi dan Sistem Pencernaan Manusia", "Pengangkutan dalam Manusia dan Haiwan", "Keimunan Manusia",
"Koordinasi dan Gerak Balas dalam Manusia", "Homeostasis dan Sistem Urinari Manusia", "Sokongan dan Pergerakan dalam Manusia dan Haiwan",
"Pembiakan Seks, Perkembangan dan Pertumbuhan dalam Manusia dan Haiwan"
],
"Tingkatan 5": [
"Organisasi Tisu Tumbuhan dan Pertumbuhan", "Struktur dan Fungsi Daun", "Nutrisi dalam Tumbuhan",
"Pengangkutan dalam Tumbuhan", "Gerak Balas dalam Tumbuhan", "Pembiakan Seks dalam Tumbuhan Berbunga",
"Penyesuaian Tumbuhan pada Habitat", "Biodiversiti", "Ekosistem", "Kelestarian Alam Sekitar",
"Pewarisan", "Variasi", "Teknologi Genetik"
]
},
"Fizik": {
"Tingkatan 4": [
"Pengukuran", "Daya dan Gerakan I", "Kegravitian", "Haba", "Gelombang", "Cahaya dan Optik"
],
"Tingkatan 5": [
"Daya dan Gerakan II", "Tekanan", "Elektrik", "Keelektromagnetan", "Elektronik", "Fizik Nuklear", "Fizik Kuantum"
]
},
"Matematik Tambahan": {
"Tingkatan 4": [
"Fungsi", "Fungsi Kuadratik", "Sistem Persamaan", "Indeks, Surd dan Logaritma",
"Janjang", "Hukum Linear", "Geometri Koordinat", "Vektor", "Penyelesaian Segi Tiga", "Nombor Indeks"
],
"Tingkatan 5": [
"Sukatan Membulat", "Pembezaan", "Pengamiran", "Pilih Atur dan Gabungan",
"Taburan Kebarangkalian", "Fungsi Trigonometri", "Pengaturcaraan Linear", "Kinematik Gerakan Linear"
]
}
};

const subjectEmojis = {
"Kimia": "⚗️",
"Biologi": "🧬",
"Fizik": "🧲",
"Matematik Tambahan": "➕"
};

const trackerEl = document.getElementById("tracker");

function createSubjectSection(subject, grades) {
let total = 0, checked = 0;
const wrapper = document.createElement("section");
wrapper.className = "subject";

const title = document.createElement("h2");
title.textContent = `${subjectEmojis[subject] || ""} ${subject}`;
wrapper.appendChild(title);

Object.entries(grades).forEach(([grade, chapters]) => {
const subtitle = document.createElement("div");
subtitle.className = "grade";
subtitle.textContent = grade;
wrapper.appendChild(subtitle);

const list = document.createElement("ul");
list.className = "chapter-list";

chapters.forEach((chapter, index) => {
const id = `${subject}-${grade}-${index}`;
const li = document.createElement("li");
li.className = "chapter-item";

const checkbox = document.createElement("input");
checkbox.type = "checkbox";
checkbox.id = id;

if (localStorage.getItem(id) === "true") {
checkbox.checked = true;
checked++;
}

checkbox.addEventListener("change", () => {
localStorage.setItem(id, checkbox.checked);
updateProgress();
});

const label = document.createElement("label");
label.htmlFor = id;
label.textContent = chapter;

li.appendChild(checkbox);
li.appendChild(label);
list.appendChild(li);
total++;
});

wrapper.appendChild(list);
});

const progress = document.createElement("div");
progress.className = "progress";

const bar = document.createElement("div");
bar.className = "progress-bar";

const fill = document.createElement("div");
fill.className = "progress-fill";
fill.style.width = `${(checked / total) * 100}%`;

bar.appendChild(fill);
progress.appendChild(bar);
wrapper.appendChild(progress);

wrapper.dataset.total = total;
wrapper.dataset.subject = subject;

trackerEl.appendChild(wrapper);
}

function updateProgress() {
const sections = document.querySelectorAll(".subject");
sections.forEach(section => {
const total = parseInt(section.dataset.total);
const inputs = section.querySelectorAll("input[type='checkbox']");
const checked = Array.from(inputs).filter(i => i.checked).length;
const fill = section.querySelector(".progress-fill");
fill.style.width = `${(checked / total) * 100}%`;
});
}

function startCountdown() {
const countdownEl = document.getElementById("countdown");
const examDate = new Date("2025-11-11T00:00:00");
setInterval(() => {
const now = new Date();
const diff = examDate - now;
const days = Math.floor(diff / (1000 * 60 * 60 * 24));
const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
const mins = Math.floor((diff / (1000 * 60)) % 60);
countdownEl.textContent = `Countdown to SPM: ${days}d ${hours}h ${mins}m`;
}, 1000);
}

startCountdown();
Object.entries(subjects).forEach(([subject, grades]) =>
createSubjectSection(subject, grades)
);
updateProgress();
</script>
</body>
</html>
